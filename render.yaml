services:
  - type: web
    name: event-checkin-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: event-checkin-db
          property: connectionString

      - key: CORS_ORIGIN
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: AI_API_KEY
        sync: false

      - key: SENTRY_DSN
        sync: false

databases:
  - name: event-checkin-db
    plan: free
    postgresMajorVersion: "16"